<style>
/* ============================================================
   MARC DE REVISIÓ
   El llenç del document conserva la identitat SINAPSI exacta.
   Aquest marc és a part i s'adapta al tema de qui mira.
   ============================================================ */
:root {
  --sx-bg:     #E7ECF2;
  --sx-panel:  #FFFFFF;
  --sx-line:   #D3DDE7;
  --sx-ink:    #212E3A;
  --sx-dim:    #5F6E7D;
  --sx-accent: #1D4E89;
  --sx-shadow: 0 1px 2px rgba(16,30,48,.06), 0 12px 32px rgba(16,30,48,.10);
  --sx-display: "Ubuntu", -apple-system, "Segoe UI", Roboto, sans-serif;
  --sx-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sx-bg:     #0E1620;
    --sx-panel:  #16202C;
    --sx-line:   #26323F;
    --sx-ink:    #C7D4E1;
    --sx-dim:    #7C8B9B;
    --sx-accent: #74A9E4;
    --sx-shadow: 0 1px 2px rgba(0,0,0,.30), 0 14px 40px rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"] {
  --sx-bg:     #0E1620;
  --sx-panel:  #16202C;
  --sx-line:   #26323F;
  --sx-ink:    #C7D4E1;
  --sx-dim:    #7C8B9B;
  --sx-accent: #74A9E4;
  --sx-shadow: 0 1px 2px rgba(0,0,0,.30), 0 14px 40px rgba(0,0,0,.42);
}
:root[data-theme="light"] {
  --sx-bg:     #E7ECF2;
  --sx-panel:  #FFFFFF;
  --sx-line:   #D3DDE7;
  --sx-ink:    #212E3A;
  --sx-dim:    #5F6E7D;
  --sx-accent: #1D4E89;
  --sx-shadow: 0 1px 2px rgba(16,30,48,.06), 0 12px 32px rgba(16,30,48,.10);
}

.sx-app {
  min-height: 100vh;
  background: var(--sx-bg);
  color: var(--sx-ink);
  font-family: var(--sx-display);
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
  align-items: start;
}

/* ---- Rail de navegació ---- */
.sx-rail {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 26px 18px 32px;
  background: var(--sx-panel);
  border-right: 1px solid var(--sx-line);
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.sx-brand .sx-eyebrow {
  font-family: var(--sx-mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--sx-accent);
}
.sx-brand h1 {
  margin: 5px 0 2px;
  font-size: 1.32rem;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.15;
  text-wrap: balance;
}
.sx-brand p { margin: 0; font-size: .84rem; color: var(--sx-dim); }

.sx-group { display: flex; flex-direction: column; gap: 6px; }
.sx-group > h2 {
  margin: 0 0 2px;
  font-family: var(--sx-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--sx-dim);
}
.sx-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }

.sx-nav-item {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.sx-nav-item:hover { background: color-mix(in srgb, var(--sx-accent) 8%, transparent); }
.sx-nav-item:focus-visible { outline: 2px solid var(--sx-accent); outline-offset: 2px; }
.sx-nav-item[aria-current="true"] {
  background: color-mix(in srgb, var(--sx-accent) 13%, transparent);
  border-color: color-mix(in srgb, var(--sx-accent) 38%, transparent);
}
.sx-ref {
  font-family: var(--sx-mono);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .05em;
  color: var(--sx-accent);
  flex: 0 0 auto;
}
.sx-nav-txt { display: flex; flex-direction: column; min-width: 0; }
.sx-nav-ttl { font-size: .88rem; font-weight: 500; line-height: 1.3; }
.sx-nav-sub { font-size: .74rem; color: var(--sx-dim); line-height: 1.35; margin-top: 1px; }

.sx-foot {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--sx-line);
  font-size: .74rem;
  line-height: 1.5;
  color: var(--sx-dim);
}

/* ---- Llenç del document ---- */
.sx-canvas { padding: 30px 26px 60px; min-width: 0; }
.sx-paper {
  max-width: 760px;
  margin: 0 auto;
  border: 1px solid var(--sx-line);
  border-radius: 12px;
  box-shadow: var(--sx-shadow);
  overflow: hidden;
}
.sx-page[hidden] { display: none; }

/* ---- Mòbil: el rail passa a ser una tira horitzontal ---- */
@media (max-width: 900px) {
  .sx-app { grid-template-columns: minmax(0, 1fr); }
  .sx-rail {
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    overflow-x: auto;
    padding: 14px 16px;
    border-right: none;
    border-bottom: 1px solid var(--sx-line);
  }
  .sx-brand, .sx-foot { display: none; }
  .sx-group { flex-direction: row; align-items: center; gap: 8px; }
  .sx-group > h2 { flex: 0 0 auto; }
  .sx-group ul { flex-direction: row; }
  .sx-nav-item { padding: 6px 11px; }
  .sx-nav-txt { display: none; }
  .sx-canvas { padding: 16px 12px 40px; }
  .sx-paper { border-radius: 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<!--IDENTITAT-->
</style>

<script>
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.sx-nav-item'));

  function show(id, push) {
    var found = false;
    items.forEach(function (btn) {
      var on = btn.dataset.target === id;
      btn.setAttribute('aria-current', on ? 'true' : 'false');
      var page = document.getElementById(btn.dataset.target);
      if (page) { page.hidden = !on; }
      if (on) { found = true; }
    });
    if (!found) { return false; }
    // En alguns iframes amb sandbox, replaceState llança SecurityError.
    // La navegació ha de continuar funcionant igualment.
    if (push) {
      try {
        if (location.hash !== '#' + id) { history.replaceState(null, '', '#' + id); }
      } catch (e) { /* enllaç directe no disponible; no és crític */ }
    }
    window.scrollTo(0, 0);
    return true;
  }

  items.forEach(function (btn) {
    btn.addEventListener('click', function () { show(btn.dataset.target, true); });
  });

  // Enllaç directe a una pàgina concreta: .../#p-t2
  var initial = '';
  try { initial = location.hash.replace('#', ''); } catch (e) { /* ignora */ }
  if (!initial || !show(initial, false)) { show(items[0].dataset.target, false); }
  window.addEventListener('hashchange', function () {
    show(location.hash.replace('#', ''), false);
  });
})();

// Motor del quiz — idèntic al de les pàgines reals.
<!--QUIZ-->
</script>
